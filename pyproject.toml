[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "day08-langgraph-agent-lab"
version = "0.1.0"
description = "Starter skeleton for LangGraph agentic orchestration lab"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "pydantic>=2.7",
  "PyYAML>=6.0",
  "rich>=13.7",
  "typer>=0.12",
  "langgraph>=0.3.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.2",
  "pytest-cov>=5.0",
  "ruff>=0.5.0",
  "mypy>=1.10",
]
google = ["langchain-google-genai>=2.1.0"]
openai = ["langchain-openai>=0.3.0"]
anthropic = ["langchain-anthropic>=0.3.0"]
sqlite = ["langgraph-checkpoint-sqlite>=2.0"]
postgres = ["langgraph-checkpoint-postgres>=2.0"]

[project.scripts]
agent-lab = "langgraph_agent_lab.cli:app"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "N", "ANN"]
# ANN401: LangGraph's compiled graph and checkpointer objects have no public
# static type to name, so `Any` is the honest annotation at those boundaries.
ignore = ["ANN101", "ANN102", "ANN401"]

[tool.ruff.lint.per-file-ignores]
# Test functions are discovered by name and never called by typed code, so
# requiring return/parameter annotations on them adds noise without safety.
# E402: collection-time skip guards (pytestmark) must precede the imports they
# guard, otherwise the module fails to import on a machine without the extras.
"tests/*" = ["ANN001", "ANN002", "ANN003", "ANN201", "ANN202", "E402"]

[tool.mypy]
python_version = "3.11"

# Optional provider/persistence extras are imported lazily inside functions and
# may legitimately be absent (see pyproject optional-dependencies). Their
# absence is a runtime concern handled by try/except, not a type error.
[[tool.mypy.overrides]]
module = [
  "langchain_openai.*",
  "langchain_anthropic.*",
  "langchain_google_genai.*",
  "langgraph.checkpoint.postgres.*",
  "psycopg.*",
  "yaml.*",
]
ignore_missing_imports = true

[tool.pytest.ini_options]
minversion = "8.0"
addopts = "-q --strict-markers"
testpaths = ["tests"]
